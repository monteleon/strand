name: CI

# Runs on every push and pull request — including forks. The job below is
# deliberately secret-free: it scans source text only (no LinkedIn data, no
# database, no credentials, no dependency install), so a fork's first PR shows
# green without any configuration.
on:
  push:
    branches: [main]
  pull_request:

# Scope (deliberate, MVP): two gates — the privacy-isolation boundary (dependency-
# free, fork-safe by design) and a typecheck. The full test suite and `bun run
# build` are NOT gated here yet; add them as a further job when wanted. Both jobs
# below are secret-free (no LinkedIn data, no database, no credentials).
jobs:
  isolation:
    name: messages-category isolation (privacy boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # check-isolation.ts uses GNU grep (present on ubuntu-latest) and only
      # node:child_process / node:process — no third-party deps, so we skip
      # `bun install` entirely. It enforces the three-layer boundary that keeps
      # the `messages` epistemic category isolated (ISC-265 JS-import,
      # ISC-289 SQL-keyword, ISC-301 ORM-symbol). Exit 0 = clean, 1 = violation.
      - name: Isolation probes (ISC-265 / 289 / 301)
        run: bun run scripts/check-isolation.ts

  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Unlike the isolation job, typecheck needs the dependency tree (typescript
      # + @types/*). bun.lock is committed, so --frozen-lockfile gives reproducible
      # installs and fails loudly if package.json and the lockfile drift apart
      # (rather than silently resolving a different tree). Still secret-free: no
      # database, no credentials, no network beyond the package registry.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

